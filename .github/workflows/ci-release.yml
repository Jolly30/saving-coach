name: Release APK

on:
  push:
    tags:
      - 'v*'    # e.g. v1.0.0, v1.2.0-beta

permissions:
  contents: write

jobs:
  release:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode Keystore
        run: |
          echo '${{ secrets.KEYSTORE_BASE64 }}' | base64 -d > release.keystore

      - name: Setup Google Services
        run: |
          echo '${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}' | base64 -d > app/google-services.json

      - name: Setup Local Properties
        run: |
          echo "sdk.dir=${{ env.ANDROID_HOME }}" > local.properties
          echo "proxy.url=${{ secrets.PROXY_URL }}" >> local.properties
          echo "coingecko.proxy.url=${{ secrets.COINGECKO_PROXY_URL }}" >> local.properties
          echo "finnhub.proxy.url=${{ secrets.FINNHUB_PROXY_URL }}" >> local.properties
          echo "gemini.api.key=${{ secrets.GEMINI_API_KEY }}" >> local.properties

      - name: Build signed release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Rename APK to piggy.apk
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/piggy.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            app/build/outputs/apk/release/piggy.apk
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
